<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SONICORE</title>
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-main);
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--c-terra);
        }
        .login-title { color: var(--c-terra); font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; font-size: 16px;
        }
        .form-group input:focus { border-color: var(--c-olive); }
        .btn-login {
            width: 100%; padding: 12px; background-color: var(--c-olive); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { background-color: var(--c-gold); }
        .error-msg { color: var(--c-salmon); margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">🎵 SONICORE</div>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/web/login" method="post">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" required placeholder="Ej: admin">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="******">
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        
        <p style="margin-top: 15px; font-size: 12px; color: #aaa;">
            ¿No tienes cuenta? Pídele al admin que te registre.
        </p>
    </div>
</body>
</html>
